[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zkidentity", "cli"]
[tool.setuptools.package-dir]
"" = "."

[project]
name = "zkidentity"
version = "0.1.0"
description = "Zero-knowledge identity system for creating and managing unlinkable alias identities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
    "pynacl>=1.5.0",
    "pyld>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
zkidentity = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["zkidentity", "cli"]
omit = ["tests/*", "*/test_*.py"]

